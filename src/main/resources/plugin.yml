name: OceanDynamics
version: 1.0.0
main: com.oceandynamics.OceanDynamics
api-version: '1.21'
author: OceanDynamics
website: https://example.com
description: Smooth ocean currents + global wind for boats and rafts.

commands:
  oceandynamics:
    description: OceanDynamics command root
    usage: /oceandynamics <reload|wind|debug>
    aliases: [od]

permissions:
  oceandynamics.admin:
    description: Allows admin commands for OceanDynamics
    default: op
